user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    charset utf-8;
    client_max_body_size 100M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS resolver. It permits TradeX to start after Nginx
    # without making Nginx fail when the gateway is temporarily unavailable.
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream videoshare_backend {
        server videoshare-api1:5001;
        # server videoshare-api2:5002;
        # server videoshare-api3:5003;
    }

    include /etc/nginx/conf.d/*.conf;
}
