user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    charset utf-8;
    client_max_body_size 100M;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    upstream backend {
        server videoshare-api1:5001;
        server videoshare-api2:5002;
        server videoshare-api3:5003;
        keepalive 32;
    }

    # HTTP Server: Redirect to HTTPS except ACME challenges
    server {
        listen 80 default_server;
        server_name _;

        # Allow Let's Encrypt HTTP-01 challenge verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        http2 on;
        server_name api.videoshare.shubhamprakash681.in;

        # SSL Certificates
        ssl_certificate     /etc/letsencrypt/live/api.videoshare.shubhamprakash681.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.videoshare.shubhamprakash681.in/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Main API Proxy
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Essential Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / Persistent connection support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for large video uploads/streaming
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}